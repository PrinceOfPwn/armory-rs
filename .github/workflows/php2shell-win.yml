name: php2shell-win-test

# php2shell (CVE-2026-109618/109619) Windows validation, Hailmary CI pattern:
# vulnerable stack (XAMPP portable PHP 8.2.12, mod_php) boots on windows-latest,
# control request must answer (Windows responde), then multipart arms are sent
# (se pueda enviar cosas). Evidence is uploaded as an artifact. Nothing external
# is contacted: the target is the runner's own localhost Apache.

on:
  workflow_dispatch:

jobs:
  p2s:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: stage xampp 8.2.12
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\xampp.zip" "https://sourceforge.net/projects/xampp/files/XAMPP%20Windows/8.2.12/xampp-portable-windows-x64-8.2.12-0-VS16.zip"
          Write-Host ("zip_bytes=" + (Get-Item "$env:RUNNER_TEMP\xampp.zip").Length)
          Expand-Archive -Path "$env:RUNNER_TEMP\xampp.zip" -DestinationPath "C:\" -Force
          cmd /c "C:\xampp\setup_xampp.bat --quiet" | Out-Host

      - name: configure apache 8085 + php.ini 128M
        shell: pwsh
        run: |
          $conf = "C:\xampp\apache\conf\httpd.conf"
          $fix = { param($f) (Get-Content $f) -replace '"(/xampp/)', '"C:$1' | ForEach-Object { $_ -replace '"(\\xampp\\)', '"C:$1' } | Set-Content $f -Encoding ascii }
          & $fix $conf
          $xconf = "C:\xampp\apache\conf\extra\httpd-xampp.conf"
          if (Test-Path $xconf) { & $fix $xconf }
          (Get-Content $conf) -replace '^Listen 80\s*$', 'Listen 127.0.0.1:8085' | Set-Content $conf -Encoding ascii
          (Get-Content $conf) -replace '^\s*Include conf/extra/httpd-ssl.conf', '#Include conf/extra/httpd-ssl.conf' | Set-Content $conf -Encoding ascii
          Select-String -Path $conf -Pattern '^ServerRoot|^LoadModule php|^PHPIniDir|^DocumentRoot' | ForEach-Object { Write-Host ("paths: " + $_.Line) }
          Select-String -Path $conf -Pattern '^Listen|^#?Include conf/extra/httpd-ssl' | ForEach-Object { Write-Host ("conf: " + $_.Line) }
          $ini = "C:\xampp\php\php.ini"
          (Get-Content $ini) -replace '"\\\\xampp', '"C:\\xampp' | ForEach-Object { $_ -replace '\\xampp', 'C:/xampp' } | Set-Content $ini -Encoding ascii
          (Get-Content $ini) -replace '^memory_limit\s*=.*', 'memory_limit = 128M' |
            ForEach-Object { $_ -replace '^post_max_size\s*=.*', 'post_max_size = 8M' } | Set-Content $ini -Encoding ascii
          Add-Content $ini "session.upload_progress.enabled = 1"
          Add-Content $ini 'extension_dir = "C:\xampp\php\ext"'
          Select-String -Path $ini -Pattern '^\s*(memory_limit|post_max_size|session.upload_progress.enabled|file_uploads)' | ForEach-Object { Write-Host ("php.ini: " + $_.Line) }

      - name: boot apache + php2shell detection (single step)
        shell: pwsh
        run: |
          $bin = "C:\xampp\apache\bin\httpd.exe"
          Write-Host "== httpd -t =="
          & $bin -t 2>&1 | ForEach-Object { Write-Host ("t: " + $_) }
          $env:PATH = "C:\xampp\php;C:\xampp\apache\bin;" + $env:PATH
          $err = "$env:RUNNER_TEMP\httpd_err.txt"
          $out = "$env:RUNNER_TEMP\httpd_out.txt"
          $p = Start-Process -FilePath $bin -ArgumentList '-X' -WindowStyle Hidden -WorkingDirectory 'C:\xampp\apache\bin' -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
          Start-Sleep -Seconds 6
          if ($p.HasExited) {
            Write-Host ("HTTPD EXITED code=" + $p.ExitCode)
            Get-Content $err -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("err: " + $_) }
            Get-Content $out -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("out: " + $_) }
            exit 1
          }
          $up = $false
          foreach ($i in 1..15) {
            $t = New-Object Net.Sockets.TcpClient
            try { $t.Connect('127.0.0.1', 8085); $up = $true; $t.Close(); break } catch { $t.Close(); Start-Sleep -Seconds 2 }
          }
          Write-Host ("port8085_up=" + $up)
          if (-not $up) {
            Get-Content $err -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("err: " + $_) }
            Get-Content $out -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("out: " + $_) }
            exit 1
          }
          $c = Invoke-WebRequest -Uri "http://127.0.0.1:8085/index.php" -UseBasicParsing -TimeoutSec 30
          Write-Host ("CONTROL status=" + $c.StatusCode + " bytes=" + $c.RawContentLength)
          if ($c.StatusCode -ne 200) { exit 1 }
          python -m pip install --quiet h11 tqdm
          Write-Host "== detect-only ladder =="
          python php2shell/php2shell_pwn.py --url http://127.0.0.1:8085/ --detect-only --timeout 90 2>&1 | Tee-Object -FilePath win_detect.log
          Write-Host "== a1-only ladder =="
          python php2shell/php2shell_pwn.py --url http://127.0.0.1:8085/ --a1-only --timeout 120 2>&1 | Tee-Object -FilePath win_a1.log
          Write-Host "== control after arms =="
          try {
            $c2 = Invoke-WebRequest -Uri "http://127.0.0.1:8085/index.php" -UseBasicParsing -TimeoutSec 30
            Write-Host ("POST_ARMS status=" + $c2.StatusCode + " bytes=" + $c2.RawContentLength)
          } catch {
            Write-Host ("POST_ARMS FAILED: " + $_.Exception.Message + " (httpd alive=" + (-not $p.HasExited) + " exit=" + $p.ExitCode + ")")
          }
          Write-Host ("httpd_alive=" + (-not $p.HasExited))

      - name: evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ev | Out-Null
          Copy-Item win_*.log ev/ -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\httpd_err.txt" -ErrorAction SilentlyContinue | Out-File -Encoding utf8 ev\httpd_err.txt
          Get-Content "C:\xampp\apache\logs\error.log" -Tail 80 -ErrorAction SilentlyContinue | Out-File -Encoding utf8 ev\apache_error_tail.txt
          Get-Content "C:\xampp\apache\logs\access.log" -Tail 40 -ErrorAction SilentlyContinue | Out-File -Encoding utf8 ev\apache_access_tail.txt
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 5 -ErrorAction SilentlyContinue | Format-List | Out-File -Encoding utf8 ev\wer1000.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2s-win-evidence
          path: ev
