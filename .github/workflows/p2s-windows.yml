name: p2s-windows-ci
on: [push, workflow_dispatch]
jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4.30', '7.4.33', '8.0.30', '8.2.12', '8.3.35']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: memory_limit=8M, post_max_size=32M, session.upload_progress.enabled=1, display_errors=1, display_startup_errors=1, log_errors=1, error_log=php_errors.log
      - name: Show PHP build
        shell: pwsh
        run: |
          php -v
          php -i | Select-String -Pattern 'memory_limit|post_max_size|upload_progress|Thread Safety|Architecture|Compiler' | ForEach-Object { $_.Line }
      - name: Start server, run harness, verify (single step)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path docroot | Out-Null
          Set-Content -Path docroot/index.php -Value "<?php echo 'P2S-OK ' . PHP_VERSION;"
          $p = Start-Process -FilePath php -ArgumentList '-S','127.0.0.1:8080','-t','docroot' -PassThru -WindowStyle Hidden -RedirectStandardOutput php_server.log -RedirectStandardError php_server.err.log
          $p.Id | Out-File server.pid
          Start-Sleep -Seconds 3
          try { Write-Host ('HEALTH: ' + (Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing).Content) } catch { Write-Host ('HEALTH FAILED: ' + $_.Exception.Message) }
          python p2s/windows_harness.py --php ${{ matrix.php }} --host 127.0.0.1 --port 8080 --arm-bytes 1800000 --out windows_result_${{ matrix.php }}.json
          Write-Host ('HARNESS_RC=' + $LASTEXITCODE)
          $proc = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if ($proc) { Write-Host ('PHP server STILL ALIVE pid ' + $p.Id) } else { Write-Host 'PHP server DIED' }
          Write-Host '=== result json ==='
          Get-Content windows_result_${{ matrix.php }}.json -ErrorAction SilentlyContinue
          Write-Host '=== php_server.err.log tail ==='
          Get-Content php_server.err.log -Tail 60 -ErrorAction SilentlyContinue
          Write-Host '=== php_errors.log tail ==='
          Get-Content php_errors.log -Tail 40 -ErrorAction SilentlyContinue
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2s-windows-${{ matrix.php }}
          path: |
            windows_result_*.json
            php_server*.log
            php_errors.log
          if-no-files-found: ignore
